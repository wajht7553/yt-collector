<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Review Tool</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #12121a;
        --bg-card: #1a1a2e;
        --bg-card-hover: #222240;
        --accent-blue: #4f8cff;
        --accent-green: #34d399;
        --accent-red: #f87171;
        --accent-amber: #fbbf24;
        --text-primary: #e8e8f0;
        --text-secondary: #9898b0;
        --text-dim: #5a5a78;
        --border: #2a2a40;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
      }

      .header {
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        border-bottom: 1px solid var(--border);
        padding: 16px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
        backdrop-filter: blur(20px);
      }

      .header h1 {
        font-size: 20px;
        font-weight: 600;
        background: linear-gradient(
          135deg,
          var(--accent-blue),
          var(--accent-green)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header-stats {
        display: flex;
        gap: 16px;
        align-items: center;
      }

      .stat-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-secondary);
        padding: 6px 12px;
        background: var(--bg-primary);
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .stat-badge .num {
        font-weight: 700;
        font-size: 15px;
      }
      .stat-badge.accepted .num {
        color: var(--accent-green);
      }
      .stat-badge.rejected .num {
        color: var(--accent-red);
      }
      .stat-badge.pending .num {
        color: var(--accent-amber);
      }

      .filters {
        padding: 10px 32px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        background: var(--bg-secondary);
        border-bottom: 1px solid var(--border);
      }

      .filter-btn {
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 13px;
        font-family: "Inter", sans-serif;
        transition: all 0.2s;
      }

      .filter-btn:hover {
        border-color: var(--accent-blue);
        color: var(--text-primary);
      }
      .filter-btn.active {
        background: var(--accent-blue);
        color: white;
        border-color: var(--accent-blue);
      }

      .filter-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-group + .filter-group {
        border-left: 1px solid var(--border);
        padding-left: 8px;
      }

      .progress-bar-bg {
        width: 100%;
        height: 3px;
        background: var(--border);
      }
      .progress-bar-fill {
        height: 3px;
        background: linear-gradient(
          90deg,
          var(--accent-blue),
          var(--accent-green)
        );
        transition: width 0.3s;
      }

      .main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px;
      }

      .video-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        margin-bottom: 16px;
        overflow: hidden;
        transition: all 0.3s;
      }

      .video-card:hover {
        border-color: #3a3a58;
      }
      .video-card.accepted {
        border-color: var(--accent-green);
        background: linear-gradient(
          135deg,
          rgba(52, 211, 153, 0.05),
          var(--bg-card)
        );
      }
      .video-card.rejected {
        border-color: var(--accent-red);
        background: linear-gradient(
          135deg,
          rgba(248, 113, 113, 0.05),
          var(--bg-card)
        );
        opacity: 0.5;
      }
      .video-card.focused {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 2px rgba(79, 140, 255, 0.2);
      }

      .video-poster {
        width: 100%;
        aspect-ratio: 16/9;
        border: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
      }

      .video-poster .play-icon {
        width: 64px;
        height: 64px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(10px);
        transition: transform 0.2s;
      }

      .video-poster:hover .play-icon {
        transform: scale(1.1);
      }

      .play-icon::after {
        content: "";
        border-left: 22px solid white;
        border-top: 13px solid transparent;
        border-bottom: 13px solid transparent;
        margin-left: 4px;
      }

      .video-player {
        width: 100%;
        aspect-ratio: 16/9;
        min-height: 200px;
        border: 0;
        background: #000;
        display: block;
      }

      .video-info {
        padding: 14px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .video-meta {
        flex: 1;
        min-width: 0;
      }

      .video-name {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .video-details {
        font-size: 11px;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
      }

      .source-link {
        color: var(--accent-blue);
      }

      .video-details span {
        background: var(--bg-primary);
        padding: 2px 7px;
        border-radius: 4px;
      }

      .video-actions {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }

      .btn {
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.2s;
      }

      .btn-accept {
        background: linear-gradient(135deg, #059669, #34d399);
        color: white;
      }
      .btn-accept:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
      }
      .btn-reject {
        background: linear-gradient(135deg, #dc2626, #f87171);
        color: white;
      }
      .btn-reject:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(248, 113, 113, 0.3);
      }
      .btn-undo {
        background: var(--bg-primary);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      .btn-undo:hover {
        border-color: var(--accent-blue);
        color: var(--text-primary);
      }

      .status-tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-left: 8px;
      }

      .status-tag.accepted {
        background: rgba(52, 211, 153, 0.15);
        color: var(--accent-green);
      }
      .status-tag.rejected {
        background: rgba(248, 113, 113, 0.15);
        color: var(--accent-red);
      }

      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        padding: 16px 0 24px;
      }

      .page-btn {
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        cursor: pointer;
        font-family: "Inter", sans-serif;
        font-size: 12px;
        transition: all 0.2s;
        min-width: 36px;
      }

      .page-btn:hover {
        border-color: var(--accent-blue);
        color: var(--text-primary);
      }
      .page-count {
        color: var(--text-secondary);
        font-size: 12px;
      }
      .page-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--text-dim);
      }

      .empty-state h2 {
        font-size: 22px;
        margin-bottom: 8px;
        color: var(--text-secondary);
      }

      .message {
        color: var(--accent-red);
        max-width: 1000px;
        padding: 12px 24px 0;
        margin: 0 auto;
      }

      .message:empty {
        display: none;
      }

      .keyboard-hint {
        position: fixed;
        bottom: 16px;
        right: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 11px;
        color: var(--text-dim);
        backdrop-filter: blur(20px);
        line-height: 1.6;
      }

      .keyboard-hint kbd {
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 10px;
        color: var(--text-secondary);
        font-family: "Inter", sans-serif;
      }

      .credit {
        position: fixed;
        bottom: 16px;
        left: 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 11px;
        color: var(--text-dim);
        backdrop-filter: blur(20px);
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1 id="project-title">Video Review Tool</h1>
      <div class="header-stats">
        <div class="stat-badge pending">
          <span class="num" id="s-pending">0</span> Pending
        </div>
        <div class="stat-badge accepted">
          <span class="num" id="s-accepted">0</span> Accepted
        </div>
        <div class="stat-badge rejected">
          <span class="num" id="s-rejected">0</span> Rejected
        </div>
        <div class="stat-badge">
          <span class="num" id="s-total">0</span> Total
        </div>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="message" id="message" role="alert"></div>

    <div class="main" id="video-list"></div>

    <div class="pagination" id="pagination"></div>

    <div class="credit">
      Vibe Coded by Wajahat Ullah 🤍<br />
      SKKU Applied AI, VIS2Know Lab
    </div>

    <div class="keyboard-hint">
      <kbd>A</kbd> Accept &nbsp; <kbd>R</kbd> Reject &nbsp;
      <kbd>U</kbd> Undo<br />
      <kbd>&darr;</kbd> Next &nbsp; <kbd>&uarr;</kbd> Prev &nbsp;
      <kbd>Space</kbd> Play
    </div>

    <script>
      const PAGE_SIZE = {{PAGE_SIZE}};
      const MEDIA_ORIGIN = 'https://www.youtube.com';
      const statuses = ['pending', 'accepted', 'rejected'];
      const filters = { status: '', class_name: '', language: '' };
      const list = document.getElementById('video-list');
      const message = document.getElementById('message');
      let allVideos = [];
      let visible = [];
      let currentPage = 0;
      let focusedIdx = 0;
      let activePlayer = null;

      async function init() {
        const [videoResponse, configResponse] = await Promise.all([
          fetch('/api/videos'),
          fetch('/api/config'),
        ]);
        if (!videoResponse.ok || !configResponse.ok) {
          throw new Error('Could not load the review catalog.');
        }
        allVideos = await videoResponse.json();
        const config = await configResponse.json();
        const languages = [...new Set(allVideos.map(video => video.language))].sort();
        const classes = [...new Set(allVideos.map(video => video.class_name))].sort();
        document.getElementById('project-title').textContent = config.name +
          (config.locked_language ? ' — Review (' + config.locked_language.toUpperCase() + ')' : ' — Review');
        filters.language = languages.includes(config.language) ? config.language : '';
        addFilters('status', 'All Statuses', statuses, capitalize);
        addFilters('class_name', 'All Classes', classes, classLabel);
        if (!config.locked_language && languages.length > 1) {
          addFilters('language', 'All Languages', languages, value => value.toUpperCase());
        }
        render();
      }

      function capitalize(value) {
        return value[0].toUpperCase() + value.slice(1);
      }

      function classLabel(value) {
        return value.replace(/_/g, ' ');
      }

      function element(tag, className, label) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (label) node.textContent = label;
        return node;
      }

      function button(className, label, onClick) {
        const node = element('button', className, label);
        node.type = 'button';
        node.addEventListener('click', onClick);
        return node;
      }

      function addFilters(key, allLabel, values, format) {
        const group = element('div', 'filter-group');
        for (const value of ['', ...values]) {
          const option = button('filter-btn', value ? format(value) : allLabel, () => {
            filters[key] = value;
            for (const sibling of group.children) {
              const selected = sibling === option;
              sibling.classList.toggle('active', selected);
              sibling.setAttribute('aria-pressed', selected);
            }
            setPage(0);
          });
          const selected = filters[key] === value;
          option.classList.toggle('active', selected);
          option.setAttribute('aria-pressed', selected);
          group.append(option);
        }
        document.getElementById('filters').append(group);
      }

      function render() {
        const scoped = allVideos.filter(video =>
          (!filters.class_name || video.class_name === filters.class_name) &&
          (!filters.language || video.language === filters.language)
        );
        const filtered = filters.status
          ? scoped.filter(video => video.status === filters.status)
          : scoped;
        updateStats(scoped);

        const pageCount = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
        currentPage = Math.min(currentPage, pageCount - 1);
        const start = currentPage * PAGE_SIZE;
        visible = filtered.slice(start, start + PAGE_SIZE);
        focusedIdx = Math.min(focusedIdx, Math.max(0, visible.length - 1));

        activePlayer = null;
        if (visible.length) {
          list.replaceChildren(...visible.map(renderCard));
        } else {
          const empty = element('div', 'empty-state');
          empty.append(element('h2', '', 'No videos match the current filters.'));
          list.replaceChildren(empty);
        }
        renderPagination(pageCount);
      }

      function renderCard(video, idx) {
        const title = video.title || video.video_id;
        const card = element('article', 'video-card ' + video.status);
        if (idx === focusedIdx) card.classList.add('focused');
        card.addEventListener('click', () => setFocus(idx));

        const play = button('video-poster', '', () => playVideo(play, video));
        play.setAttribute('aria-label', 'Play ' + title);
        play.append(element('span', 'play-icon'));

        const info = element('div', 'video-info');
        const meta = element('div', 'video-meta');
        const heading = element('div', 'video-name', title);
        heading.title = title;
        if (video.status !== 'pending') {
          heading.append(element('span', 'status-tag ' + video.status, video.status));
        }
        const details = element('div', 'video-details');
        const duration = formatDuration(video.duration);
        for (const detail of [classLabel(video.class_name), video.language.toUpperCase(), video.channel, duration]) {
          if (detail) details.append(element('span', '', detail));
        }
        const source = element('a', 'source-link', 'Open on YouTube');
        source.href = MEDIA_ORIGIN + '/watch?v=' + encodeURIComponent(video.video_id);
        source.target = '_blank';
        source.rel = 'noopener';
        details.append(source);
        meta.append(heading, details);

        const actions = element('div', 'video-actions');
        if (video.status === 'pending') {
          actions.append(
            button('btn btn-accept', 'Accept', () => decide(video, 'accepted')),
            button('btn btn-reject', 'Reject', () => decide(video, 'rejected'))
          );
        } else {
          actions.append(button('btn btn-undo', 'Undo', () => decide(video, 'pending')));
        }
        info.append(meta, actions);
        card.append(play, info);
        return card;
      }

      function formatDuration(duration) {
        if (!Number.isFinite(duration) || duration <= 0) return '';
        const seconds = Math.floor(duration);
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor(seconds / 60) % 60;
        const remainder = String(seconds % 60).padStart(2, '0');
        return hours
          ? hours + ':' + String(minutes).padStart(2, '0') + ':' + remainder
          : minutes + ':' + remainder;
      }

      function playVideo(button, video) {
        if (activePlayer) activePlayer.frame.replaceWith(activePlayer.button);
        const frame = element('iframe', 'video-player');
        frame.title = video.title || 'YouTube video';
        frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
        frame.allowFullscreen = true;
        frame.referrerPolicy = 'strict-origin-when-cross-origin';
        frame.src = MEDIA_ORIGIN + '/embed/' + encodeURIComponent(video.video_id) + '?autoplay=1';
        button.replaceWith(frame);
        activePlayer = { frame, button };
      }

      function setFocus(idx) {
        list.children[focusedIdx]?.classList.remove('focused');
        focusedIdx = idx;
        list.children[idx]?.classList.add('focused');
      }

      function renderPagination(pageCount) {
        const pagination = document.getElementById('pagination');
        pagination.replaceChildren();
        if (pageCount <= 1) return;
        const prev = button('page-btn', 'Previous', () => setPage(currentPage - 1));
        const next = button('page-btn', 'Next', () => setPage(currentPage + 1));
        prev.disabled = currentPage === 0;
        next.disabled = currentPage === pageCount - 1;
        pagination.append(prev, element('span', 'page-count', (currentPage + 1) + ' / ' + pageCount), next);
      }

      function setPage(page) {
        currentPage = page;
        focusedIdx = 0;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function updateStats(scope) {
        const counts = { pending: 0, accepted: 0, rejected: 0 };
        for (const video of scope) counts[video.status]++;
        for (const status of statuses) document.getElementById('s-' + status).textContent = counts[status];
        document.getElementById('s-total').textContent = scope.length;
        const reviewed = counts.accepted + counts.rejected;
        document.getElementById('progress-bar').style.width =
          (scope.length ? reviewed / scope.length * 100 : 0) + '%';
      }

      async function decide(video, status) {
        if (video.saving || video.status === status) return;
        video.saving = true;
        message.textContent = '';
        try {
          const response = await fetch('/api/decide', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              class_name: video.class_name,
              language: video.language,
              video_id: video.video_id,
              status,
            }),
          });
          if (!response.ok) throw new Error('Could not save the review decision. Try again.');
          video.status = (await response.json()).status;
          render();
        } catch (error) {
          message.textContent = error.message;
        } finally {
          video.saving = false;
        }
      }

      document.addEventListener('keydown', event => {
        if (event.altKey || event.ctrlKey || event.metaKey ||
            event.target.closest('input, select, textarea')) return;
        const video = visible[focusedIdx];
        if (!video) return;
        const key = event.key.toLowerCase();
        if (['arrowdown', 'j', 'arrowup', 'k'].includes(key)) {
          event.preventDefault();
          const direction = key === 'arrowdown' || key === 'j' ? 1 : -1;
          setFocus(Math.max(0, Math.min(visible.length - 1, focusedIdx + direction)));
          list.children[focusedIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else if (key === 'a' || key === 'r' || key === 'u') {
          decide(video, { a: 'accepted', r: 'rejected', u: 'pending' }[key]);
        } else if (key === ' ' && !event.target.closest('a, button')) {
          event.preventDefault();
          list.children[focusedIdx].querySelector('.video-poster')?.click();
        }
      });

      init().catch(error => { message.textContent = error.message; });
    </script>
  </body>
</html>
